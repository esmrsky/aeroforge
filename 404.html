<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AEROFORGE has moved</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="refresh" content="0; url=https://aeroforge.esmrsky.workers.dev/" />
    <style>
      :root { color-scheme: dark }
      body { margin:0; min-height:100svh; display:grid; place-items:center; background:#080b0f;
             color:#9ba9b4; font:400 15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
             text-align:center; padding:24px }
      a { color:#8bd0e8 }
    </style>
  </head>
  <body>
    <main>
      <p>AEROFORGE has moved.</p>
      <p><a id="target" href="https://aeroforge.esmrsky.workers.dev/">aeroforge.esmrsky.workers.dev</a></p>
    </main>
    <script>
      // Carry whatever deep path was requested across to the new host, so an
      // old link to any sub-page lands in the right place rather than the root.
      var base = "https://aeroforge.esmrsky.workers.dev";
      var path = location.pathname.replace(/^\/aeroforge/, "");
      var to = base + (path === "/" ? "" : path) + location.search + location.hash;
      document.getElementById("target").href = to;
      location.replace(to);
    </script>
  </body>
</html>
